name: Dependency freshness

# Daily check for updates to every dependency used across the monorepo.
# Safe (patch/minor) updates are applied automatically in a pull request;
# major updates are reported with a proposal, never applied blindly.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Report outdated dependencies
        id: report
        run: |
          node packages/cli/dist/bin.js deps --root . --json > deps-report.json || true
          node scripts/deps-summary.mjs deps-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Apply safe updates
        run: node packages/cli/dist/bin.js deps --root . --update safe
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build && pnpm test
      - name: Open pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: chore/deps-freshness
          title: "chore(deps): apply safe dependency updates"
          commit-message: "chore(deps): apply safe dependency updates"
          body-path: deps-report.md
          labels: dependencies
