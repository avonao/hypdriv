packages:
  - packages/*
  - examples/*

# Shared dependency versions. Reference them as "catalog:" in package.json files.
catalog:
  # Toolchain
  typescript: ^6.0.3
  tsdown: ^0.23.4
  vitest: ^4.1.12
  "@biomejs/biome": ^2.6.4
  "@changesets/cli": ^3.0.3
  "@types/node": ^26.6.6
  publint: ^0.3.25
  # Runtime typings
  "@cloudflare/workers-types": ^5.20261030.1
  "@cloudflare/vitest-pool-workers": ^0.23.0
  wrangler: ^4.156.0
  miniflare: ^4.20260730.0
  # Framework peers
  next: ^16.4.3
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@opennextjs/cloudflare": ^1.20.14
  # Small, standards-based deps
  "@standard-schema/spec": ^1.1.0
  web-vitals: ^6.2.3

# Dependencies that are allowed to run install scripts.
minimumReleaseAgeExclude:
  - tsdown@0.23.4

onlyBuiltDependencies:
  - "@biomejs/biome"
  - esbuild
  - workerd
  - sharp
