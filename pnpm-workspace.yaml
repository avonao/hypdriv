packages:
  - packages/*
  - examples/*
  - e2e/*

# Shared dependency versions. Reference them as "catalog:" in package.json files.
catalog:
  # Toolchain
  typescript: ^6.0.3
  tsdown: ^0.23.4
  vitest: ^4.1.12
  "@biomejs/biome": ^2.6.4
  "@changesets/cli": ^3.0.3
  "@types/node": ^26.6.6
  publint: ^0.3.25
  # Runtime typings
  "@cloudflare/workers-types": ^5.20261101.1
  "@cloudflare/vitest-plugin": ^1.4.11
  wrangler: ^4.156.0
  miniflare: ^4.20260730.0
  # Framework peers
  next: ^16.4.3
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@opennextjs/cloudflare": ^1.20.15
  # Vite hosts
  vite: ^8.3.5
  "@cloudflare/vite-plugin": ^1.66.0
  "@vitejs/plugin-react": ^6.1.2
  babel-plugin-react-compiler: ^1.0.0
  # Astro host (@hypdriv/astro)
  astro: ^7.4.4
  "@astrojs/cloudflare": ^14.4.3
  "@astrojs/node": ^11.1.9
  "@astrojs/vercel": ^11.0.17
  # SvelteKit
  "@sveltejs/kit": ^3.1.1
  "@sveltejs/vite-plugin-svelte": ^7.3.1
  "@sveltejs/adapter-cloudflare": ^8.0.2
  "@sveltejs/adapter-vercel": ^7.0.2
  "@sveltejs/adapter-node": ^6.0.1
  svelte: ^5.57.3
  # TanStack Start (React). @tanstack/react-start pins @tanstack/react-router exactly: keep them in step.
  "@tanstack/react-start": ^1.169.4
  "@tanstack/react-router": 1.170.46
  "@tanstack/router-generator": ^1.167.46
  # vinext (Cloudflare's Vite implementation of the Next.js API)
  vinext: ^1.4.0
  "@vinext/cloudflare": ^1.3.0
  "@vitejs/plugin-rsc": ^0.5.38
  react-server-dom-webpack: ^19.3.1
  nitro: 3.0.261029-rc
  # React Router (framework mode)
  react-router: ^8.5.1
  "@react-router/dev": ^8.5.1
  "@react-router/node": ^8.5.1
  "@react-router/serve": ^8.5.1
  isbot: ^5.2.2
  "@vercel/react-router": ^1.3.7
  "@vercel/nft": ^1.11.0
  # Nuxt (Nuxt 4.6 runs on Nitro 2 / h3 1.x)
  nuxt: ^4.6.3
  nitropack: ^2.13.5
  h3: ^1.15.11
  vue: ^3.5.44
  vue-router: ^5.4.0
  # Small, standards-based deps
  "@standard-schema/spec": ^1.1.0
  web-vitals: ^6.2.3
  zod: ^4.6.7

# pnpm's supply-chain delay (minimumReleaseAge) is bypassed for these very recent releases.
minimumReleaseAgeExclude:
  - tsdown@0.23.4
  - "@cloudflare/workers-types@5.20261030.1 || 5.20261101.1"
  - miniflare@5.20261023.3-beta
  - wrangler@4.156.0
  - "@cloudflare/vitest-plugin@1.4.11"
  - "@sveltejs/kit@3.1.1"
  - "@sveltejs/adapter-cloudflare@8.0.2"
  - "@sveltejs/adapter-vercel@7.0.2"
  - "@sveltejs/adapter-node@6.0.1"
  - svelte@5.57.3
  - nitro@3.0.261029-rc
  - vinext@1.4.0
  - "@vinext/cloudflare@1.3.0"
  - "@vinext/types@1.0.2"
  - react-server-dom-webpack@19.3.1

# @vercel/react-router 1.3.7 still declares React Router 7 peers; its preset works with React Router 8
# (Hypdriv's React Router integration reads its server bundles).
peerDependencyRules:
  allowedVersions:
    "@vercel/react-router>@react-router/dev": "8"
    "@vercel/react-router>@react-router/node": "8"

# Dependencies that are allowed to run install scripts.
allowBuilds:
  '@biomejs/biome': true
  esbuild: true
  workerd: true
  sharp: true
