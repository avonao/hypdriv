packages:
  - packages/*
  - examples/*
  - e2e/*

# Shared dependency versions. Reference them as "catalog:" in package.json files.
catalog:
  # Toolchain
  typescript: ^6.0.3
  tsdown: ^0.23.4
  vitest: ^4.1.12
  "@biomejs/biome": ^2.6.4
  "@changesets/cli": ^3.0.3
  "@types/node": ^26.6.6
  publint: ^0.3.25
  # Runtime typings
  "@cloudflare/workers-types": ^5.20261030.1
  "@cloudflare/vitest-plugin": ^1.4.11
  wrangler: ^4.156.0
  miniflare: ^4.20260730.0
  # Framework peers
  next: ^16.4.3
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@opennextjs/cloudflare": ^1.20.14
  # Vite hosts
  vite: ^8.3.5
  "@cloudflare/vite-plugin": ^1.66.0
  "@vitejs/plugin-react": ^6.1.2
  babel-plugin-react-compiler: ^1.0.0
  # Nuxt (Nuxt 4.6 runs on Nitro 2 / h3 1.x)
  nuxt: ^4.6.3
  nitropack: ^2.13.5
  h3: ^1.15.11
  vue: ^3.5.44
  vue-router: ^5.4.0
  # Small, standards-based deps
  "@standard-schema/spec": ^1.1.0
  web-vitals: ^6.2.3
  zod: ^4.6.7

# pnpm's supply-chain delay (minimumReleaseAge) is bypassed for these very recent releases.
minimumReleaseAgeExclude:
  - tsdown@0.23.4
  - "@cloudflare/workers-types@5.20261030.1"
  - miniflare@5.20261023.3-beta
  - wrangler@4.156.0
  - "@cloudflare/vitest-plugin@1.4.11"

# Dependencies that are allowed to run install scripts.
allowBuilds:
  '@biomejs/biome': true
  esbuild: true
  workerd: true
  sharp: true
